name: Publish to PyPI

# Publishing uses PyPI Trusted Publishing (OIDC) — no API token is stored in
# this repository. Before the first release, add a trusted publisher on PyPI
# for project `md-ddl`: owner `Semprini`, repository `md-ddl`, workflow
# `publish.yml`, environment `pypi`.
#
# To cut a release: bump `__version__` in `src/md_ddl/__init__.py`, tag the
# commit `v<version>`, and publish a GitHub release for that tag.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Verify the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/md_ddl/__init__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke-test:
    name: Install and initialise a project
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the wheel, set up a project, verify it resolves
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          mkdir demo && cd demo
          md-ddl --version
          md-ddl init --name demo
          test -f .md-ddl/md-ddl-specification/1-Foundation.md
          test -f .claude/commands/agent-guide.md
          test -f .github/agents/agent-guide.agent.md
          grep -q '`.md-ddl/agents/' .claude/commands/agent-guide.md
          md-ddl check
          md-ddl lint ".md-ddl/examples/Simple Customer"

  publish:
    name: Publish to PyPI
    needs: [build, smoke-test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/md-ddl
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
